services:
  - type: web
    name: ai-eval-backend
    env: python
    plan: free
    rootDir: Development-of-AI-Response-Validation-System-with-Hallucination-Detection-Assistance-main/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
